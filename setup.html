<!doctype html>
<meta charset="utf-8">
<title>Sprint Board — Kurulum</title>
<style>
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 16px 18px; font: 11px/1.5 ui-monospace, Menlo, monospace;
    color: #cfe9d8; background: rgba(6, 18, 10, .96);
    border: 1px solid rgba(57,255,20,.35); border-radius: 10px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { margin: 0 0 3px; font-size: 12px; letter-spacing: .18em; color: #39ff14; font-weight: 700 }
  .sub { margin: 0 0 14px; color: #5f8a70; font-size: 9px; line-height: 1.6 }
  a { color: #7fb0ff; text-decoration: none }
  a:hover { text-decoration: underline }
  .hint { margin-top: 2px; color: #4d6b5a; font-size: 9px }
  button {
    margin-top: 16px; width: 100%; padding: 7px; font: inherit; font-weight: 700;
    letter-spacing: .12em; color: #06120a; background: #39ff14; border: 0;
    border-radius: 5px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default }
  .err {
    margin-top: 12px; padding: 6px 8px; border-radius: 5px; font-size: 9px; line-height: 1.6;
    color: #ffb0b0; background: rgba(255,0,0,.08); border: 1px solid rgba(255,80,80,.35);
  }
  .err ul { margin: 0; padding-left: 14px }
</style>

<h1>⚔ SPRINT BOARD</h1>
<p class="sub">Giriş yap, gerisi kendiliğinden gelir — Jira adresin, e-postan ve
izinlerin hesabından okunur. Hiçbir şey dosyaya yazılmaz, keychain'e gider.</p>

<button id="atlassian">ATLASSIAN İLE GİRİŞ YAP</button>
<div class="hint">Tarayıcı açılır, onaylarsın, kapanır. Salt okunur izin:
  görüntüleme dışında Jira'da hiçbir şey değiştirilmez.</div>



<div id="err" class="err" style="display:none"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (m) => window.webkit?.messageHandlers?.sb?.postMessage(m);

  // Linkler varsayılan tarayıcıda açılmalı; WKWebView içinde açılırsa kurulum
  // ekranının yerini alır ve kullanıcı geri dönemez.
  document.querySelectorAll("[data-url]").forEach((a) =>
    a.addEventListener("click", (e) => { e.preventDefault(); post({ open: a.dataset.url }); }));

  $("atlassian").addEventListener("click", () => {
    $("atlassian").disabled = true;
    $("atlassian").textContent = "TARAYICI AÇILDI, ONAYINI BEKLİYOR…";
    $("err").style.display = "none";
    post({ atlassianLogin: true });
  });


  // Swift doğrulama sonucunu buraya geri veriyor.
  window.sbSetupResult = (res) => {
    $("atlassian").disabled = false;
    $("atlassian").textContent = "ATLASSIAN İLE GİRİŞ YAP";
    const errs = (res && res.errors) || ["bilinmeyen hata"];
    $("err").innerHTML = "<ul>" + errs.map((e) =>
      "<li>" + String(e).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])) + "</li>"
    ).join("") + "</ul>";
    $("err").style.display = "block";
  };

  // Pencere yüksekliğini içeriğe göre ayarla (view.html ile aynı köprü).
  requestAnimationFrame(() => post({ height: document.body.scrollHeight + 32 }));
</script>
