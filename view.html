<!doctype html>
<meta charset="utf-8">
<title>Sprint Board</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    font-family: ui-monospace, Menlo, "SF Mono", monospace;
    font-size: 11px; line-height: 1.5; color: #39ff14;
    -webkit-user-select: none; user-select: none; cursor: default;
  }

  #card {
    position: relative; margin: 0; padding: 14px 16px 12px;
    background: linear-gradient(180deg, rgba(13,11,26,.96), rgba(9,8,18,.96));
    border: 1px solid rgba(57,255,20,.35); border-radius: 10px;
    box-shadow: inset 0 0 60px rgba(57,255,20,.04);
    overflow: hidden;
  }
  /* CRT scanline */
  #card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }

  @keyframes sbBlink { 0%,100% { opacity: 1 } 50% { opacity: .28 } }
  @keyframes sbPulse {
    0%,100% { border-color:#ff3b3b; box-shadow:0 0 0 rgba(255,59,59,0); background:rgba(255,59,59,.06) }
    50%     { border-color:#ff9c9c; box-shadow:0 0 16px rgba(255,59,59,.5); background:rgba(255,59,59,.14) }
  }

  /* Title drag handle — the Swift side uses this strip to move the window */
  .hdr { display:flex; justify-content:space-between; align-items:baseline;
         letter-spacing:.06em; text-shadow:0 0 8px rgba(57,255,20,.45);
         cursor: grab; }   /* dragging lives in Swift: the top 34px */
  .hdr:active { cursor: grabbing; }
  .hdr .name { font-weight:700 }
  .hdr .lights { display:inline-flex; gap:6px; margin-right:8px; vertical-align:-1px }
  .hdr .tl { width:10px; height:10px; border-radius:50%; cursor:pointer; display:inline-block }
  .hdr .tl.close { background:#ff5f57 } .hdr .tl.min { background:#febc2e } .hdr .tl.fill { background:#28c840 }
  .hdr .tl:hover { filter:brightness(1.25) }
  body.filled #card { min-height:calc(100vh - 2px) }
  .hdr .right { color:#9bffb0; font-size:10px; opacity:.85 }
  .rf { cursor:pointer; margin-left:9px; color:#7CFFAE; font-size:12px }
  .rf:hover { color:#fff; text-shadow:0 0 8px rgba(57,255,20,.8) }
  /* fetch.mjs takes ~13 s; a ⟳ that did not spin felt like the click had not landed */
  .rf.spin { display:inline-block; color:#fff; animation:sbSpin 1s linear infinite }
  @keyframes sbSpin { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) {
    .rf.spin { animation:none; opacity:.45 }
  }

  .siege { margin:6px 0 10px; color:#7CFFAE; font-size:10px; letter-spacing:.1em;
           display:flex; justify-content:space-between; align-items:baseline }
  .siege .tools { letter-spacing:0 }

  .boss { border:1px solid #ff3b3b; border-radius:7px; padding:8px 10px; margin-bottom:10px;
          background:rgba(255,59,59,.07); animation:sbPulse 1.2s ease-in-out infinite; cursor:pointer }
  .boss .tag { color:#ff6b6b; letter-spacing:.22em; font-weight:700; font-size:10px }
  .boss .ghost { color:#b98bff; letter-spacing:.06em }
  .boss .key { color:#fff; font-weight:700 }
  .boss .sum { color:#ffb3b3; font-size:10px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .boss .hp { color:#ff3b3b; letter-spacing:.06em; margin-top:3px }

  .clean { border:1px solid rgba(57,255,20,.3); border-radius:7px; padding:8px 10px;
           margin-bottom:10px; background:rgba(57,255,20,.05); color:#7CFFAE }

  .row { display:flex; gap:7px; align-items:baseline; padding:2px 0; cursor:pointer; border-radius:3px }
  .row:hover { background:rgba(57,255,20,.07) }
  .row .k { color:#cfe9ff; width:92px; flex:none; white-space:nowrap }
  .row .qa { flex:none; width:62px; color:#5fb3c4; overflow:hidden; white-space:nowrap }
  .row .carry { flex:none; width:26px; text-align:right; color:#b98bff }
  .row .d { flex:none; color:#6f8aa8 }
  .row .age { flex:none; width:30px; text-align:right; color:#44607d }
  .row.done { opacity:.5 }
  .row.done .k { color:#7ea88a }
  /* Struck through = work finished. Jira's "done" category alone does not say
     that: some of the 15 statuses mean "waiting to ship to prod". */
  .row.done.finished .k, .row.done.cancelled .k { text-decoration:line-through }
  /* Awaiting release is still being tracked — less faded, keep it green. */
  .row.done.pending { opacity:.78 }
  .row.done.pending .k { color:#7CFFAE; text-decoration:none }
  .row.warn .d, .row.warn .k { color:#ffb000 }
  .row.critical .d, .row.critical .k { color:#ff6b6b }
  .row.warn .d, .row.critical .d { animation:sbBlink 1.6s ease-in-out infinite }
  .row .goal { flex:none; color:#ffd24a; font-size:9px; letter-spacing:.06em }

  /* Two top-level sections: what Jira says about the sprint, what GitHub says about PRs. */
  .sec { display:flex; align-items:center; gap:7px; margin:12px 0 4px; color:#9bffb0;
         font-size:10px; font-weight:700; letter-spacing:.22em }
  .sec::before, .sec::after { content:""; border-top:3px double rgba(57,255,20,.35) }
  .sec::before { width:14px } .sec::after { flex:1 }
  .siege + .sec { margin-top:0 }
  .sec.gh { color:#c8c8c8 }
  .sec.gh::before, .sec.gh::after { border-top-color:rgba(200,200,200,.3) }
  .sec + .band { margin-top:2px; border-top:none; padding-top:0 }
  .sec + .goals { margin-top:2px }
  .sec + .off { margin-top:2px }
  .clear { color:#5f7f6a; font-size:10px }

  /* One section per status; the status lives in the header, not on every row. */
  .ghd { display:flex; align-items:center; gap:6px; margin:7px 0 1px; color:#5f8f73;
         font-size:9px; letter-spacing:.14em; text-transform:uppercase }
  .ghd::after { content:""; flex:1; border-top:1px dashed rgba(57,255,20,.18) }
  .ghd.p0 { color:#7fa894 } .ghd.p1 { color:#7CFFAE } .ghd.p3 { color:#6b6b80 }

  /* Every row's PR column. On waiting-to-ship and shipped rows the row's fade stays off it. */
  .row .rp { flex:1; min-width:0; text-align:right; font-size:10px }
  .row .rp .g + .g { margin-left:8px }
  .row .rp .c, .row .rp .w { white-space:nowrap }
  .row .rp .c { cursor:pointer }
  .row .rp .c:hover { text-decoration:underline }
  .row .rp .open { color:#3fb950; text-shadow:0 0 6px rgba(63,185,80,.55) }
  .row .rp .merged, .row .rp .deployed { color:#a371f7; text-shadow:0 0 6px rgba(163,113,247,.55) }
  .row .rp .none { color:#44607d }
  .row .rp .c.bad { color:#ff6b6b; text-shadow:0 0 6px rgba(255,107,107,.55) }
  .row .rp .c.wait { color:#ffb000; text-shadow:0 0 6px rgba(255,176,0,.45) }
  .row .rp .badge { color:#55708c } .row .rp .badge.bad { color:#ff6b6b }
  .row .rp .badge.wait { color:#ffb000 } .row .rp .badge.good { color:#4a8f6a }
  .row.done.rel { opacity:1 }
  .row.done.rel > span:not(.rp) { opacity:.5 }
  .row.done.pending.rel > span:not(.rp) { opacity:.78 }

  .goals { border:1px solid rgba(120,200,255,.35); border-radius:7px; padding:6px 9px;
           margin:10px 0; background:rgba(120,200,255,.05) }
  .goals .ghdr { color:#9fd4ff; font-size:10px; letter-spacing:.12em; font-weight:700; margin-bottom:3px }
  .goals .grow { display:flex; gap:7px; font-size:10px; color:#cfe9ff; cursor:pointer; border-radius:3px }
  .goals .grow:hover { background:rgba(255,255,255,.06) }
  .goals .grow .gkey { flex:none; white-space:nowrap }
  .goals .grow .gsum { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.85 }
  .goals .grow .gown { flex:none; max-width:26%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8fa9c9 }
  .goals .grow .gst { flex:none; max-width:22%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8fa9c9 }
  .goals .gnone { font-size:10px; color:#8fa9c9 }
  .goals .grow.done { opacity:.55; color:#7CFFAE }
  .goals .grow.done .gkey { text-decoration:line-through }
  .goals .grow.yellow, .goals .grow.yellow .gst { color:#ffb000 }
  .goals .grow.red, .goals .grow.red .gst { color:#ff6b6b }
  .goals.yellow { border-color:rgba(255,176,0,.55); background:rgba(255,176,0,.06) }
  .goals.yellow .ghdr { color:#ffb000 }
  .goals.red { border-color:rgba(255,59,59,.6); background:rgba(255,59,59,.07) }
  .goals.red .ghdr { color:#ff6b6b; animation:sbBlink 1.6s ease-in-out infinite }

  .band { margin-top:9px; border-top:1px dashed rgba(255,59,59,.4); padding-top:6px }

  /* Staying silent when the PR layer is off is the worst option: the user cannot
     tell why the band is missing. A dim but visible row. */
  .off { margin-top:9px; padding:4px 8px; border-radius:6px; font-size:9px;
         line-height:1.5; color:#8a7fb8; background:rgba(138,127,184,.10);
         border:1px solid rgba(138,127,184,.28) }

  /* Update row: should draw the eye, but not as hard as the BOSS — nothing urgent. */
  .upd { margin-top:9px; padding:5px 8px; border-radius:6px; cursor:pointer;
         font-size:10px; letter-spacing:.04em; color:#ffd34d;
         background:rgba(255,211,77,.08); border:1px solid rgba(255,211,77,.35) }
  .upd:hover { background:rgba(255,211,77,.16) }
  .band .bhdr { color:#ff6b6b; font-size:10px; letter-spacing:.12em; margin-bottom:3px }
  .band .brow { color:#ffa3a3; font-size:10px; display:flex; gap:8px; cursor:pointer; border-radius:3px }
  .band .brow:hover { background:rgba(255,255,255,.06) }
  .band .brow .brepo { flex:none }
  .band .brow .bchecks { margin-left:auto; color:#c98a8a; max-width:58%;
                         overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .band.rel { border-top-color:rgba(124,255,174,.35) }
  .band.rel .bhdr { color:#7CFFAE }
  .band.rel .brow { color:#a8e6c0 }
  .band.rel .brow .bchecks { color:#6f9d81 }
  .band.waiting { border-top-color:rgba(255,176,0,.4) }
  .band.waiting .bhdr { color:#ffb000 } .band.waiting .brow { color:#ffd88a }
  .band.waiting .brow .bchecks { color:#c9a86a }
  .band.review { border-top-color:rgba(120,170,255,.45) }
  .band.review .bhdr { color:#7fb0ff } .band.review .brow { color:#bcd6ff }
  .band.review .brow .bchecks { color:#7f97bd }
  .band.review .brow.stale { color:#ffb0b0 }
  .band.prs { border-top-color:rgba(200,200,200,.3) }
  .band.prs .bhdr { color:#c8c8c8 } .band.prs .brow { color:#b8c4b8 }
  .band.prs .brow .bchecks { color:#7c8c7c }
  .band.prs .brow.bad, .band.prs .brow.bad .bchecks { color:#ff6b6b }

  .notes { margin-top:9px; padding-top:7px; border-top:1px solid rgba(57,255,20,.18) }
  .notes .nhdr { color:#44607d; font-size:9px; letter-spacing:.16em; margin-bottom:3px }
  .notes .nrow { display:flex; gap:6px; align-items:baseline; font-size:10px; color:#cfe9d8; padding:1px 0 }
  .notes .ntext { flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere }
  .notes .ndel { flex:none; color:#4d6b5a; cursor:pointer }
  .notes .ndel:hover { color:#ff6b6b }
  .notes .ninput { width:100%; margin-top:4px; background:rgba(57,255,20,.05);
                   border:1px solid rgba(57,255,20,.2); border-radius:4px; color:#9bffb0;
                   font-family:inherit; font-size:10px; padding:3px 6px; outline:none;
                   -webkit-user-select:text; user-select:text }
  .notes .ninput::placeholder { color:#3f6b52 }
  .notes .ninput:focus { border-color:rgba(57,255,20,.5); background:rgba(57,255,20,.09) }

  .stale { margin-bottom:8px; padding:5px 8px; border-radius:6px; font-size:9px;
           line-height:1.5; letter-spacing:0; color:#ffd88a;
           background:rgba(255,176,0,.10); border:1px solid rgba(255,176,0,.35) }
  .stale b { color:#ffb000 }

  .err .hint { margin-top:6px; color:#8a7fb8; font-size:9px; line-height:1.5;
               letter-spacing:0; text-transform:none }

  .err { color:#ff6b6b; font-size:10px; white-space:pre-wrap }

  @media (prefers-reduced-motion: reduce) {
    .boss, .row.warn .d, .row.critical .d { animation:none !important }
  }
</style>

<div id="card"><div class="err">⏳ fetching data…</div></div>

<script>
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const bar = (f, w = 10) => {
    const n = Math.max(0, Math.min(w, Math.round((f || 0) * w)));
    return "█".repeat(n) + "░".repeat(w - n);
  };
  const clip = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");
  const DONE_ICON = { finished: "✅", cancelled: "✖", pending: "🟢" };
  const icon = (t) => t.done ? (DONE_ICON[t.release] || "🟢")
    : t.alert ? "🔥" : t.carriedOver ? "👻" : t.statusCategory === "new" ? "🛡" : "🗡";
  const PR_MARK = { FAILURE:"✗", ERROR:"✗", PENDING:"●", EXPECTED:"●", SUCCESS:"✓" };
  const prMark = (s) => PR_MARK[s] || "·";
  // When the state is unknown (draft PR, or the CI query failed) ASSIGN NO CLASS and no mark:
  // painting a stateless PR as passed reads "green" when in fact nothing is known.
  const prClass = (s) => (s === "FAILURE" || s === "ERROR") ? "bad"
    : (s === "PENDING" || s === "EXPECTED") ? "wait" : s ? "good" : "";
  const hhmm = (iso) => { try { const d = new Date(iso);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  } catch { return "—"; } };

  // Opening links is delegated to the Swift side (a WKWebView cannot do it itself).
  const openUrl = (u) => { if (u && u !== "#") window.webkit?.messageHandlers?.sb?.postMessage({ open: u }); };
  const refresh = () => window.webkit?.messageHandlers?.sb?.postMessage({ refresh: true });

  const band = (cls, title, rows, mark) => rows.length ? `
    <div class="band ${cls}">
      <div class="bhdr">${title} (${rows.length})</div>
      ${rows.map((p) => `
        <div class="brow ${cls === "review" && p.days >= 2 ? "stale" : ""}"
             data-url="${esc(p.url)}" title="${esc(p.key || p.title || "")}">
          <span class="brepo">${cls === "review" ? (p.days >= 2 ? "⏰" : "·") : mark} ${esc(p.repo)}#${p.number}</span>
          <span class="bchecks">${cls === "review"
            ? esc(p.author) + " · " + p.days + "g"
            : esc((p.checks || []).join(", ") || "?")}</span>
        </div>`).join("")}
    </div>` : "";

  // Every row lists its PRs, one label per state ("#12 #34 open") so a task with several PRs
  // still fits the narrow column. An open PR's number carries the state the task badge used to
  // show (CI, conflict, review), and its tooltip says why.
  const prNumber = (p) => {
    const why = (p.checks || []).length ? " · " + p.checks.join(", ") : "";
    return `<span class="c${p.ci ? " " + prClass(p.ci) : ""}" data-url="${esc(p.url)}"
      title="${esc(p.repo)}#${esc(p.number)} · ${esc(p.title)}${esc(why)}">#${esc(p.number)}${p.ci ? prMark(p.ci) : ""}</span>`;
  };
  // When the PR search failed, the open-PR search may still have given the task its badge.
  const searchFailed = (t) => t.pr
    ? `<span class="badge ${prClass(t.pr.state)}" title="the GitHub PR search failed: ${t.pr.count} open PR(s), CI from the open-PR search">⚙${t.pr.count}${prMark(t.pr.state)}</span>`
    : `<span class="none" title="the GitHub PR search failed">PRs ?</span>`;
  const relChips = (t, prs = t.releasePrs) => prs === null ? searchFailed(t)
    : !Array.isArray(prs) ? ""
    : !prs.length ? `<span class="none">no PR</span>`
    : ["open", "merged", "deployed"].map((st) => {
        const of = prs.filter((p) => p.status === st);
        return of.length ? `<span class="g ${st}">${of.map((p) => prNumber(p) + " ").join("")}<span class="w">${st}</span></span>` : "";
      }).join("");

  // Waiting-to-ship and shipped rows fade, but their PR column stays lit.
  const PRS_STAY_LIT = new Set(["pending", "finished"]);
  const taskRow = (t) => `
        <div class="row ${esc(t.tier)}${t.release ? " " + esc(t.release) : ""}${PRS_STAY_LIT.has(t.release) ? " rel" : ""}" data-url="${esc(t.url)}"
             title="${esc(t.summary)}&#10;${esc(t.status)}: ${t.daysInStatus} business days (threshold ${t.threshold}d) · age ${t.ageDays}d">
          <span class="k">${icon(t)} ${esc(t.key)}</span>
          ${t.goal ? `<span class="goal">🎯 GOAL</span>` : ""}
          <span class="qa">${t.qaShort ? "🧪" + esc(t.qaShort) : ""}</span>
          <span class="carry"${t.carriedOver ? ` title="carried over: this is its sprint #${t.sprintCount}"` : ""}>${t.carriedOver ? "×" + t.sprintCount : ""}</span>
          <span class="rp">${relChips(t)}</span>
          <span class="d" title="${t.daysInStatus} business days in ${esc(t.status)} (threshold ${t.threshold}d)">${t.daysInStatus}g</span>
          <span class="age" title="opened ${t.ageDays} business days ago">/${t.ageDays}</span>
        </div>`;

  // Every PR that cannot be merged, with its reasons; a PR GitHub has not settled reads "checking".
  const prBand = (rows) => rows.length ? `
    <div class="band prs">
      <div class="bhdr">⛔ MERGE BLOCKED (${rows.length})</div>
      ${rows.map((p) => `
        <div class="brow ${p.kind === "checking" ? "" : "bad"}" data-url="${esc(p.url)}" title="${esc(p.title)}">
          <span class="brepo">${p.kind === "checking" ? "·" : "✗"} ${esc(p.repo)}#${p.number}</span>
          <span class="bchecks">${esc((p.reasons || []).join(" · "))}</span>
        </div>`).join("")}
    </div>` : "";

  // The flagged tasks of the sprint, whoever owns them. null = the setting is off.
  const GOAL_MARK = { done: "✓", red: "✗", yellow: "!", ok: "·" };
  const goalBand = (g) => g ? `
    <div class="goals ${esc(g.worst)}">
      <div class="ghdr">🎯 TEAM SPRINT GOAL (${g.done}/${g.total})</div>
      ${g.error ? `<div class="gnone">Could not read the goal tasks: ${esc(g.error)}</div>`
        : g.rows.length ? g.rows.map((r) => `
        <div class="grow ${esc(r.risk)}" data-url="${esc(r.url)}" title="${esc(r.summary)}">
          <span class="gkey">${GOAL_MARK[r.risk] || "·"} ${esc(r.key)}</span>
          <span class="gsum">${esc(r.summary)}</span>
          <span class="gown">${esc(r.owner || "unassigned")}</span>
          <span class="gst">${esc(r.status)}</span>
        </div>`).join("")
        : `<div class="gnone">No goal tasks in this sprint.</div>`}
    </div>` : "";

  // Work left behind in a past sprint that never shipped. It is absent from the
  // main list — once a sprint closes the main query stops returning it.
  const relBand = (rows) => rows.length ? `
    <div class="band rel">
      <div class="bhdr">🚚 PAST SPRINTS · AWAITING RELEASE (${rows.length})</div>
      ${rows.map((r) => `
        <div class="brow" data-url="${esc(r.url)}"
             title="${esc(r.summary)}&#10;${esc(r.status)} · ${r.days} business days">
          <span class="brepo">🟢 ${esc(r.key)}</span>
          <span class="bchecks">${esc(clip(r.status, 16))}${r.sprint
            ? " · " + esc(clip(r.sprint.replace(/^.*Sprint/i, "Sprint"), 12)) : ""} · ${r.days}g</span>
        </div>`).join("")}
    </div>` : "";

  let NOTES = [];
  let LAST = null;

  // Swift sends the notes from a file; draw() overwrites innerHTML, so we keep them here.
  window.sbNotes = (n) => { NOTES = Array.isArray(n) ? n : []; if (LAST) draw(LAST); };

  const notesHtml = () => `
    <div class="notes">
      <div class="nhdr">${NOTES.length ? "NOTES " + NOTES.length + "/6" : "NOTES"}</div>
      ${NOTES.map((n) => `
        <div class="nrow">
          <span class="ntext">${esc(n.text)}</span>
          <span class="ndel" data-del="${esc(n.id)}" title="sil">✕</span>
        </div>`).join("")}
      <input class="ninput" type="text" maxlength="500" placeholder="${NOTES.length >= 6
        ? "list full — the oldest drops" : "+ note… (Enter)"}">
    </div>`;

  let keepInput = "";

  let LAST_OK = null;    // the last SUCCESSFUL payload — a transient error must not wipe the card
  let staleNote = null;

  function draw(d) {
    // A single network blip turned the whole card into an error screen and the
    // next attempt was 30 minutes away. If we still hold good data, keep showing
    // it and put a "could not refresh" strip on top.
    if (d && d.ok === false && LAST_OK) {
      staleNote = { error: d.error || "unknown error", at: LAST_OK.generatedAt };
      d = LAST_OK;
    } else if (d && d.ok) {
      LAST_OK = d;
      staleNote = null;
    }
    LAST = d;
    const prevInput = document.querySelector(".ninput");
    const hadFocus = !!prevInput && document.activeElement === prevInput;
    if (prevInput) keepInput = prevInput.value;
    const card = document.getElementById("card");
    if (!d || !d.ok) {
      card.innerHTML = `<div class="err">⚠ ${esc(d && d.error || "veri yok")}</div>`;
      return;
    }
    const { sprint = {}, boss, groups = [] } = d;
    const waiting = d.waitingPrs || [], reviews = d.reviewRequests || [];

    card.innerHTML = `
      <div class="hdr">
        <span class="name"><span class="lights"><span class="tl close" data-win="close" title="close"></span><span class="tl min" data-win="minimize" title="minimize"></span><span class="tl fill" data-win="fill" title="full screen"></span></span>⚔ ${esc(clip(sprint.name, 30))}</span>
        <span class="right">${sprint.daysLeft == null ? "—" : sprint.daysLeft + "d left"}
          · ${hhmm(d.generatedAt)}</span>
      </div>

      ${staleNote ? `<div class="stale">⚠ Could not refresh: <b>${esc(staleNote.error)}</b><br>
        Showing data as of ${hhmm(staleNote.at)}. It will retry shortly; press ⟳
        if you would rather not wait.</div>` : ""}

      <div class="siege">
        <span>${bar(d.total ? d.cleared / d.total : 0, 12)} ${d.cleared}/${d.total} cleared</span>
        <span class="tools"><span class="rf" id="rf" title="refresh now">⟳</span><span class="rf" id="gear" title="settings">⚙</span></span>
      </div>

      <div class="sec">JIRA</div>

      ${goalBand(d.sprintGoal)}

      ${boss ? `
        <div class="boss" data-url="${esc(boss.url)}">
          <div class="tag">💀 B O S S ${"⚡".repeat(boss.bolts)}
            ${boss.carriedOver ? `<span class="ghost"> 👻 ×${boss.sprintCount}</span>` : ""}</div>
          <div class="key">${esc(boss.key)}</div>
          <div class="sum">${esc(clip(boss.summary, 46))}</div>
          <div class="hp">HP ${bar(Math.max(.15, Math.min(1, (boss.ratio - 1) / 2)))}
            ${esc(boss.status)} · ${boss.daysInStatus}d / threshold ${boss.threshold}d</div>
        </div>` : `<div class="clean">⚔ No boss — your sprint is clean</div>`}

      ${groups.map((g) => `
        <div class="ghd p${esc(g.phase)}">${esc(g.status)} (${g.tasks.length})</div>
        ${g.tasks.map(taskRow).join("")}`).join("")}

      ${relBand(d.pendingRelease || [])}

      <div class="sec gh">GITHUB</div>

      ${band("waiting", "⏳ WAITING", waiting, "●")}
      ${band("review", "👀 AWAITING YOUR REVIEW", reviews, "·")}
      ${prBand(d.pullRequests || [])}
      ${d.prsAvailable !== false && d.reviewsAvailable !== false && !d.requiredError
        && !waiting.length && !reviews.length && !(d.pullRequests || []).length
        ? `<div class="clear">✓ No PR waiting, to review or blocked</div>` : ""}

      ${d.prsAvailable === false ? `<div class="off">${d.githubOrgError
        ? `PR/CI bands are off — ${esc(d.githubOrgError)}. Fix it from ⚙.`
        : `PR/CI bands are off — GitHub could not be reached.
        Run <b>gh auth login</b>, or add a GitHub token from ⚔ → Settings.`}</div>` : ""}

      ${d.update ? `<div class="upd" data-url="${esc(d.update.url || "")}">
        ⬆ <b>v${esc(d.update.version)}</b> is out — click to download</div>` : ""}

      ${notesHtml()}
    `;

    // A PR inside a task row opens the PR, not the task as well.
    card.querySelectorAll("[data-url]").forEach((el) =>
      el.addEventListener("click", (e) => { e.stopPropagation(); openUrl(el.getAttribute("data-url")); }));
    card.querySelectorAll("[data-del]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        window.webkit?.messageHandlers?.sb?.postMessage({ noteDel: el.getAttribute("data-del") });
      }));
    const inp = card.querySelector(".ninput");
    if (inp) {
      inp.value = keepInput;            // text typed during a refresh must not be lost
      inp.addEventListener("input", () => { keepInput = inp.value; });
      inp.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key !== "Enter") return;
        const v = inp.value;
        inp.value = ""; keepInput = "";
        window.webkit?.messageHandlers?.sb?.postMessage({ noteAdd: v });
      });
      if (hadFocus) inp.focus();
    }
    card.querySelectorAll("[data-win]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      window.webkit?.messageHandlers?.sb?.postMessage({ win: el.dataset.win });
    }));
    const rf = document.getElementById("rf");
    if (rf) rf.addEventListener("click", (e) => {
      e.stopPropagation();
      if (rf.classList.contains("spin")) return;   // block a double trigger for the ~13 s
      rf.classList.add("spin");
      refresh();
    });
    const gear = document.getElementById("gear");
    if (gear) gear.addEventListener("click", (e) => {
      e.stopPropagation();
      window.webkit?.messageHandlers?.sb?.postMessage({ settings: true });
    });

    // Report the real content height to Swift so the window fits exactly
    window.webkit?.messageHandlers?.sb?.postMessage({ height: card.offsetHeight });
  }

  // fetch.mjs normally takes ~13 s; on the FIRST launch after a rebuild it can
  // stretch to 80 s because macOS re-asks for keychain permission. Without a
  // counter that looked like the app had hung.
  const T0 = Date.now();
  let waitTimer = setInterval(() => {
    const el = document.getElementById("card");
    if (!el || LAST) return;
    const sec = Math.round((Date.now() - T0) / 1000);
    el.innerHTML = `<div class="err">⏳ fetching data… ${sec}s` +
      (sec > 25
        ? `<div class="hint">macOS may ask for keychain permission on first launch.
             If a permission dialog appeared, choose <b>Always Allow</b>;
             it is one-off — later launches take ~13s.</div>`
        : "") + `</div>`;
  }, 1000);

  window.sbRender = (d) => {
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    draw(d);
  };
</script>
