<!doctype html>
<meta charset="utf-8">
<title>Sprint Board</title>
<style>
  :root { color-scheme: light dark;
          --panel: rgba(250,250,250,.62); --hover: rgba(0,0,0,.05); --fill: rgba(0,0,0,.035); }
  /* The window material sits behind the page; this tint keeps the dark panel dark, not grey. */
  @media (prefers-color-scheme: dark) {
    :root { --panel: rgba(28,28,30,.80); --hover: rgba(255,255,255,.07); --fill: rgba(255,255,255,.05); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* Swift keeps the window on the screen; a board taller than the screen scrolls instead,
     without the trackpad bounce that would pull the card off the window material. */
  html { overflow-y: auto; overscroll-behavior: none; }
  body {
    font: 12px -apple-system, system-ui; line-height: 1.35;
    color: -apple-system-label; font-variant-numeric: tabular-nums;
    -webkit-user-select: none; user-select: none; cursor: default;
  }

  #card {
    position: relative; margin: 0; padding: 12px 14px;
    background: var(--panel); border-radius: 10px; overflow: hidden;
  }

  /* SF Symbols: Swift injects each one as a mask image on .s-<name> */
  .sym { display:inline-block; width:13px; height:13px; flex:none; vertical-align:-2px;
         background-color:currentColor; -webkit-mask-size:contain;
         -webkit-mask-repeat:no-repeat; -webkit-mask-position:center }
  .sym.sm { width:11px; height:11px; vertical-align:-1px }
  .c-red { color:-apple-system-red } .c-orange { color:-apple-system-orange }
  .c-yellow { color:-apple-system-yellow } .c-green { color:-apple-system-green }
  .c-blue { color:-apple-system-blue } .c-purple { color:-apple-system-purple }
  .c-gray { color:-apple-system-gray } .c-2 { color:-apple-system-secondary-label }

  hr { border:0; border-top:1px solid -apple-system-separator; margin:10px 0 }

  /* Title drag handle — the Swift side uses this strip to move the window */
  .hdr { display:flex; align-items:center; gap:8px; cursor:grab }   /* dragging lives in Swift: the top 34px */
  .hdr:active { cursor:grabbing }
  .hdr .lights { display:inline-flex; gap:8px; margin-right:4px }
  .hdr .tl { width:12px; height:12px; border-radius:50%; cursor:pointer; display:inline-block;
             box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18) }
  .hdr .tl.close { background:#ff5f57 } .hdr .tl.min { background:#febc2e } .hdr .tl.fill { background:#28c840 }
  .hdr .tl:hover { filter:brightness(1.15) }
  .hdr .name { flex:1; min-width:0; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hdr .right { font-size:11px; color:-apple-system-secondary-label; white-space:nowrap }
  body.filled #card, #card:has(> .err) { min-height:100vh }

  /* A section: label left, bold value right, a bar, grey text on both sides under it */
  .sec .top { display:flex; justify-content:space-between; align-items:baseline }
  .sec .lbl { display:flex; align-items:center; gap:6px; font-weight:600 }
  .sec .val { font-weight:700 }
  .sec .under { display:flex; justify-content:space-between; align-items:center;
                font-size:11px; color:-apple-system-secondary-label }
  /* Drawn in CSS: WebKit paints a native progress bar grey whenever the window is not key,
     and the widget is seldom the key window. */
  progress { -webkit-appearance:none; appearance:none; display:block; width:100%; height:6px;
             margin:6px 0 3px; border:0 }
  progress::-webkit-progress-bar { background:rgba(128,128,128,.2); background:color-mix(in srgb, -apple-system-label 12%, transparent); border-radius:3px }
  progress::-webkit-progress-value { background:-apple-system-control-accent; border-radius:3px }
  .yellow progress::-webkit-progress-value { background:-apple-system-yellow }
  .red progress::-webkit-progress-value, .overdue progress::-webkit-progress-value { background:-apple-system-red }

  .tools { display:inline-flex; gap:2px }
  .rf { display:inline-flex; align-items:center; justify-content:center; width:22px; height:20px;
        border-radius:5px; cursor:pointer; color:-apple-system-secondary-label }
  .rf:hover { background:var(--hover); color:-apple-system-label }
  /* fetch.mjs takes ~13 s; a refresh button that did not spin felt like the click had not landed */
  .rf.spin .sym { animation:sbSpin 1s linear infinite; color:-apple-system-control-accent }
  @keyframes sbSpin { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) {
    .rf.spin .sym { animation:none; opacity:.45 }
  }

  /* The flagged tasks of the sprint */
  .goals .summary { display:flex; gap:12px; font-size:11px; color:-apple-system-secondary-label; margin:6px 0 4px }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; flex:none }
  .dot.red { background:-apple-system-red } .dot.yellow { background:-apple-system-yellow }
  .dot.ok { background:-apple-system-gray } .dot.done { background:-apple-system-green }
  .grow, .brow { display:flex; align-items:center; gap:6px; padding:2px 4px; margin:0 -4px;
                 border-radius:5px; white-space:nowrap; cursor:pointer }
  .grow:hover, .brow:hover, .row:hover { background:var(--hover) }
  .grow .gsum { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis }
  .grow .gkey { font-weight:600 }
  .grow .gside { flex:none; max-width:46%; overflow:hidden; text-overflow:ellipsis; color:-apple-system-secondary-label }
  .grow.done { opacity:.55 }
  .grow.done .gkey { text-decoration:line-through }
  .goals .gnone { font-size:11px; color:-apple-system-secondary-label }

  .overdue { display:flex; gap:8px; align-items:flex-start; padding:8px 10px; border-radius:8px; cursor:pointer;
          background:rgba(255,59,48,.14); background:color-mix(in srgb, -apple-system-red 14%, transparent) }
  .overdue .body { flex:1; min-width:0 }
  .overdue .tag { font-weight:700 }
  .overdue .sum { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .overdue .meta { font-size:11px; color:-apple-system-secondary-label }
  .all-clear { display:flex; align-items:center; gap:7px; white-space:nowrap; overflow:hidden }

  .h { display:flex; align-items:center; gap:6px; margin-bottom:4px;
       font-size:11px; font-weight:600; color:-apple-system-secondary-label }
  .h .n { font-weight:500; color:-apple-system-tertiary-label }

  .row { display:flex; gap:6px; align-items:center; padding:2px 4px; margin:0 -4px; cursor:pointer;
         border-radius:5px; white-space:nowrap }
  .row .k { min-width:68px; flex:none; font-weight:500 }
  .row .qa { flex:none; width:66px; overflow:hidden; text-overflow:ellipsis; color:-apple-system-secondary-label }
  .row .carry { flex:none; width:28px; text-align:right; color:-apple-system-purple }
  .row .d { flex:none; width:24px; text-align:right }
  .row .age { flex:none; width:34px; text-align:right; color:-apple-system-tertiary-label }
  .row.done { opacity:.5 }
  /* Struck through = work finished. Jira's "done" category alone does not say
     that: some of the 15 statuses mean "waiting to ship to prod". */
  .row.done.finished .k, .row.done.cancelled .k { text-decoration:line-through }
  /* Awaiting release is still being tracked — less faded, not struck. */
  .row.done.pending { opacity:.78 }
  .row.done.pending .k { color:-apple-system-green }
  .row.warn .d, .row.warn .k { color:-apple-system-orange }
  .row.critical .d, .row.critical .k { color:-apple-system-red }
  .goal { flex:none; font-size:9px; font-weight:600; color:-apple-system-blue; border:1px solid currentColor;
          border-radius:4px; padding:0 3px; line-height:13px }

  /* Two top-level sections: what Jira says about the sprint, what GitHub says about PRs.
     The header draws its own rule, so the separator right after it is dropped. */
  .zone { display:flex; align-items:center; gap:8px; margin:12px 0 2px; font-size:10px; font-weight:700;
          letter-spacing:.14em; color:-apple-system-secondary-label }
  .zone::after { content:""; flex:1; border-top:1px solid -apple-system-separator }
  .zone + hr { display:none }
  .clear { display:flex; align-items:center; gap:7px; margin-top:6px; font-size:11px; color:-apple-system-secondary-label }

  /* One section per status; the status lives in the header, not on every row. */
  .ghd { display:flex; align-items:center; gap:6px; margin:6px 0 1px; font-size:10px; font-weight:600;
         color:-apple-system-tertiary-label }
  .ghd .n { font-weight:500 }
  .ghd.p1 { color:-apple-system-green } .ghd.p3 { color:-apple-system-gray }

  /* Every row's PR column. On waiting-to-ship and shipped rows the row's fade stays off it. */
  .row .rp { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; text-align:right; font-size:11px }
  .row .rp .g + .g { margin-left:8px }
  .row .rp .c, .row .rp .w { white-space:nowrap }
  .row .rp .c { cursor:pointer }
  .row .rp .c:hover { text-decoration:underline }
  .row .rp .open { color:-apple-system-green }
  .row .rp .merged, .row .rp .deployed { color:-apple-system-purple }
  .row .rp .none { color:-apple-system-tertiary-label }
  .row .rp .c.bad { color:-apple-system-red } .row .rp .c.wait { color:-apple-system-orange }
  .row .rp .badge { color:-apple-system-secondary-label } .row .rp .badge.bad { color:-apple-system-red }
  .row .rp .badge.wait { color:-apple-system-orange } .row .rp .badge.good { color:-apple-system-green }
  .row.done.rel { opacity:1 }
  .row.done.rel > :not(.rp) { opacity:.5 }
  .row.done.pending.rel > :not(.rp) { opacity:.78 }

  .band .brow .brepo { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis }
  .band .brow .bchecks { flex:none; max-width:58%; overflow:hidden; text-overflow:ellipsis; color:-apple-system-secondary-label }
  .band.prs .brow.bad .bchecks { color:-apple-system-red }
  .band.review .brow.stale .bchecks { color:-apple-system-orange }

  /* Staying silent when the PR layer is off is the worst option: the user cannot
     tell why the band is missing. A dim but visible row. */
  .off, .upd, .stale { display:flex; gap:7px; align-items:flex-start; margin-top:9px; padding:6px 8px;
                       border-radius:7px; font-size:11px; background:var(--fill) }
  .off { color:-apple-system-secondary-label }
  /* Update row: should draw the eye, but not as hard as the most overdue task. */
  .upd { cursor:pointer; background:rgba(0,122,255,.12); background:color-mix(in srgb, -apple-system-blue 12%, transparent) }
  .upd:hover { background:rgba(0,122,255,.2); background:color-mix(in srgb, -apple-system-blue 20%, transparent) }
  .stale { margin:0 0 8px; background:rgba(255,204,0,.16); background:color-mix(in srgb, -apple-system-yellow 16%, transparent) }

  .notes .nrow { display:flex; gap:6px; align-items:baseline; padding:1px 0 }
  .notes .ntext { flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere }
  .notes .ndel { flex:none; color:-apple-system-tertiary-label; cursor:pointer }
  .notes .ndel:hover { color:-apple-system-red }
  .notes .ninput { width:100%; margin-top:4px; font:12px -apple-system, system-ui;
                   -webkit-user-select:text; user-select:text }

  .err .hint { margin-top:6px; color:-apple-system-secondary-label; font-size:11px }
  .err { min-height:44px; font-size:12px; white-space:pre-wrap }
</style>

<div id="card"><div class="err">Fetching data…</div></div>

<script>
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const clip = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");
  const sym = (name, cls = "") => `<i class="sym s-${name.replace(/\./g, "-")}${cls ? " " + cls : ""}"></i>`;
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  const days = (n) => n == null ? "" : n === 1 ? "1 day left" : n + " days left";
  const DONE_ICON = { finished: sym("checkmark.circle.fill", "c-green"), cancelled: sym("xmark.circle", "c-gray"),
                      pending: sym("shippingbox.fill", "c-green") };
  const icon = (t) => t.done ? (DONE_ICON[t.release] || DONE_ICON.pending)
    : t.alert ? sym("flame.fill", "c-red")
    : t.carriedOver ? sym("arrow.uturn.forward.circle", "c-purple")
    : t.statusCategory === "new" ? sym("circle", "c-gray") : sym("circle.lefthalf.filled", "c-blue");
  const PR_MARK = { FAILURE: "xmark", ERROR: "xmark", PENDING: "clock", EXPECTED: "clock", SUCCESS: "checkmark" };
  const prMark = (s) => PR_MARK[s] ? sym(PR_MARK[s], "sm") : "";
  // When the state is unknown (draft PR, or the CI query failed) ASSIGN NO CLASS and no mark:
  // painting a stateless PR as passed reads "green" when in fact nothing is known.
  const prClass = (s) => (s === "FAILURE" || s === "ERROR") ? "bad"
    : (s === "PENDING" || s === "EXPECTED") ? "wait" : s ? "good" : "";
  const hhmm = (iso) => { try { const d = new Date(iso);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  } catch { return "—"; } };

  // Opening links is delegated to the Swift side (a WKWebView cannot do it itself).
  const openUrl = (u) => { if (u && u !== "#") window.webkit?.messageHandlers?.sb?.postMessage({ open: u }); };
  const refresh = () => window.webkit?.messageHandlers?.sb?.postMessage({ refresh: true });
  // The window material covers the whole window, so the window follows the card. A drawn board
  // sets the window to its height; a placeholder (loading, error) fills the window and only grows
  // it when its text does not fit. It posts at once: a closed widget pauses animation frames.
  const fit = () => {
    const card = document.getElementById("card");
    if (card.querySelector(":scope > .err") && card.offsetHeight <= window.innerHeight) return;
    window.webkit?.messageHandlers?.sb?.postMessage({ height: card.offsetHeight });
  };
  // Swift calls this after fill mode; the next frame has the restored zoom and width.
  window.sbFit = () => requestAnimationFrame(fit);
  new ResizeObserver(fit).observe(document.getElementById("card"));

  const band = (cls, title, rows, mark) => rows.length ? `
    <hr>
    <div class="band ${cls}">
      <div class="h">${title} <span class="n">${rows.length}</span></div>
      ${rows.map((p) => `
        <div class="brow ${cls === "review" && p.days >= 2 ? "stale" : ""}"
             data-url="${esc(p.url)}" title="${esc(p.key || p.title || "")}">
          ${cls === "review" ? (p.days >= 2 ? sym("clock", "c-orange") : sym("arrow.triangle.pull", "c-blue")) : mark}
          <span class="brepo">${esc(p.repo)}#${p.number}</span>
          <span class="bchecks">${cls === "review"
            ? esc(p.author) + " · " + p.days + "d"
            : esc((p.checks || []).join(", ") || "?")}</span>
        </div>`).join("")}
    </div>` : "";

  // Every row lists its PRs, one label per state ("#12 #34 open") so a task with several PRs
  // still fits the narrow column. An open PR's number carries the state the task badge used to
  // show (CI, conflict, review), and its tooltip says why.
  const prNumber = (p) => {
    const why = (p.checks || []).length ? " · " + p.checks.join(", ") : "";
    return `<span class="c${p.ci ? " " + prClass(p.ci) : ""}" data-url="${esc(p.url)}"
      title="${esc(p.repo)}#${esc(p.number)} · ${esc(p.title)}${esc(why)}">#${esc(p.number)}${p.ci ? prMark(p.ci) : ""}</span>`;
  };
  // When the PR search failed, the open-PR search may still have given the task its badge.
  const searchFailed = (t) => t.pr
    ? `<span class="badge ${prClass(t.pr.state)}" title="the GitHub PR search failed: ${t.pr.count} open PR(s), CI from the open-PR search">${sym("arrow.triangle.pull")}${t.pr.count}${prMark(t.pr.state)}</span>`
    : `<span class="none" title="the GitHub PR search failed">PRs ?</span>`;
  const relChips = (t, prs = t.releasePrs) => prs === null ? searchFailed(t)
    : !Array.isArray(prs) ? ""
    : !prs.length ? `<span class="none">no PR</span>`
    : ["open", "merged", "deployed"].map((st) => {
        const of = prs.filter((p) => p.status === st);
        return of.length ? `<span class="g ${st}">${of.map((p) => prNumber(p) + " ").join("")}<span class="w">${st}</span></span>` : "";
      }).join("");

  // Waiting-to-ship and shipped rows fade, but their PR column stays lit.
  const PRS_STAY_LIT = new Set(["pending", "finished"]);
  const taskRow = (t) => `
        <div class="row ${esc(t.tier)}${t.release ? " " + esc(t.release) : ""}${PRS_STAY_LIT.has(t.release) ? " rel" : ""}" data-url="${esc(t.url)}"
             title="${esc(t.summary)}&#10;${esc(t.status)}: ${t.daysInStatus} business days (limit ${t.threshold}d) · age ${t.ageDays}d">
          ${icon(t)}
          <span class="k">${esc(t.key)}</span>
          ${t.goal ? `<span class="goal">GOAL</span>` : ""}
          <span class="qa">${t.qaShort ? sym("testtube.2") + " " + esc(t.qaShort) : ""}</span>
          <span class="carry"${t.carriedOver ? ` title="carried over: this is its sprint #${t.sprintCount}"` : ""}>${t.carriedOver ? sym("arrow.uturn.forward", "sm") + t.sprintCount : ""}</span>
          <span class="rp">${relChips(t)}</span>
          <span class="d" title="${t.daysInStatus} business days in ${esc(t.status)} (limit ${t.threshold}d)">${t.daysInStatus}d</span>
          <span class="age" title="opened ${t.ageDays} business days ago">${t.ageDays}d</span>
        </div>`;

  // Every PR that cannot be merged, with its reasons; a PR GitHub has not settled reads "checking".
  const prBand = (rows) => rows.length ? `
    <hr>
    <div class="band prs">
      <div class="h">${sym("xmark.octagon.fill", "sm c-red")}Merge blocked <span class="n">${rows.length}</span></div>
      ${rows.map((p) => `
        <div class="brow ${p.kind === "checking" ? "" : "bad"}" data-url="${esc(p.url)}" title="${esc(p.title)}">
          ${p.kind === "checking" ? sym("ellipsis.circle", "c-gray") : sym("xmark.circle.fill", "c-red")}
          <span class="brepo">${esc(p.repo)}#${p.number}</span>
          <span class="bchecks">${esc((p.reasons || []).join(" · "))}</span>
        </div>`).join("")}
    </div>` : "";

  // The flagged tasks of the sprint, whoever owns them. null = the setting is off.
  const RISK_WORD = { red: "critical", yellow: "at risk", ok: "on track", done: "done" };
  const goalBand = (g, daysLeft) => {
    if (!g) return "";
    const count = { red: 0, yellow: 0, ok: 0, done: 0 };
    (g.rows || []).forEach((r) => { count[r.risk] = (count[r.risk] || 0) + 1; });
    const flag = { red: "c-red", yellow: "c-yellow" }[g.worst] || "c-blue";
    // A failed goal search has no counts; the sprint's days left still show when known.
    const ok = !g.error;
    return `
    <hr>
    <div class="sec goals ${esc(g.worst)}">
      <div class="top"><span class="lbl">${sym("flag.fill", flag)}Team sprint goal</span>
        ${ok ? `<span class="val">${pct(g.done, g.total)}</span>` : ""}</div>
      ${ok ? `<progress value="${g.done}" max="${g.total || 1}"></progress>` : ""}
      ${ok || daysLeft != null ? `<div class="under"><span>${ok ? `${g.done} of ${g.total} done` : ""}</span><span>${days(daysLeft)}</span></div>` : ""}
      ${!ok ? `<div class="gnone">Could not read the goal tasks: ${esc(g.error)}</div>`
        : g.rows.length ? `
        <div class="summary">${["red", "yellow", "ok", "done"].map((k) =>
          `<span><span class="dot ${k}"></span>${count[k]} ${RISK_WORD[k]}</span>`).join("")}</div>
        ${g.rows.map((r) => `
        <div class="grow ${esc(r.risk)}" data-url="${esc(r.url)}" title="${esc(r.summary)}">
          <span class="dot ${esc(r.risk)}"></span>
          <span class="gsum"><span class="gkey">${esc(r.key)}</span> ${esc(r.summary)}</span>
          <span class="gside">${esc(r.owner || "Unassigned")} · ${esc(r.status)}</span>
        </div>`).join("")}`
        : `<div class="gnone">No goal tasks in this sprint.</div>`}
    </div>`;
  };

  // Work left behind in a past sprint that never shipped. It is absent from the
  // main list — once a sprint closes the main query stops returning it.
  const relBand = (rows) => rows.length ? `
    <hr>
    <div class="band rel">
      <div class="h">${sym("shippingbox", "sm")}Past sprints · awaiting release <span class="n">${rows.length}</span></div>
      ${rows.map((r) => `
        <div class="brow" data-url="${esc(r.url)}"
             title="${esc(r.summary)}&#10;${esc(r.status)} · ${r.days} business days">
          ${sym("shippingbox.fill", "c-green")}
          <span class="brepo">${esc(r.key)}</span>
          <span class="bchecks">${esc(clip(r.status, 16))}${r.sprint
            ? " · " + esc(clip(r.sprint.replace(/^.*Sprint/i, "Sprint"), 12)) : ""} · ${r.days}d</span>
        </div>`).join("")}
    </div>` : "";

  let NOTES = [];
  let LAST = null;

  // Swift sends the notes from a file; draw() overwrites innerHTML, so we keep them here.
  window.sbNotes = (n) => { NOTES = Array.isArray(n) ? n : []; if (LAST) draw(LAST); };

  const notesHtml = () => `
    <hr>
    <div class="notes">
      <div class="h">Notes ${NOTES.length ? `<span class="n">${NOTES.length}/6</span>` : ""}</div>
      ${NOTES.map((n) => `
        <div class="nrow">
          <span class="ntext">${esc(n.text)}</span>
          <span class="ndel" data-del="${esc(n.id)}" title="Delete">${sym("xmark", "sm")}</span>
        </div>`).join("")}
      <input class="ninput" type="text" maxlength="500" placeholder="${NOTES.length >= 6
        ? "List full — the oldest note drops" : "Add a note"}">
    </div>`;

  let keepInput = "";

  let LAST_OK = null;    // the last SUCCESSFUL payload — a transient error must not wipe the card
  let staleNote = null;

  function draw(d) {
    // A single network blip turned the whole card into an error screen and the
    // next attempt was 30 minutes away. If we still hold good data, keep showing
    // it and put a "could not refresh" strip on top.
    if (d && d.ok === false && LAST_OK) {
      staleNote = { error: d.error || "unknown error", at: LAST_OK.generatedAt };
      d = LAST_OK;
    } else if (d && d.ok) {
      LAST_OK = d;
      staleNote = null;
    }
    LAST = d;
    const prevInput = document.querySelector(".ninput");
    const hadFocus = !!prevInput && document.activeElement === prevInput;
    if (prevInput) keepInput = prevInput.value;
    const card = document.getElementById("card");
    if (!d || !d.ok) {
      card.innerHTML = `<div class="err">${sym("exclamationmark.triangle.fill", "c-red")} ${esc(d && d.error || "No data")}</div>`;
      return;
    }
    const { sprint = {}, overdue, tasks = [], groups = [] } = d;
    const waiting = d.waitingPrs || [], reviews = d.reviewRequests || [];

    card.innerHTML = `
      <div class="hdr">
        <span class="lights"><span class="tl close" data-win="close" title="close"></span><span class="tl min" data-win="minimize" title="minimize"></span><span class="tl fill" data-win="fill" title="full screen"></span></span>
        <span class="name">${esc(sprint.name)}</span>
        <span class="right">${sprint.daysLeft == null ? "—" : days(sprint.daysLeft)} · ${hhmm(d.generatedAt)}</span>
      </div>
      <hr>

      ${staleNote ? `<div class="stale">${sym("exclamationmark.triangle.fill", "c-yellow")}<div>Could not refresh: <b>${esc(staleNote.error)}</b><br>
        Showing data as of ${hhmm(staleNote.at)}. It will retry shortly; press Refresh
        if you would rather not wait.</div></div>` : ""}

      <div class="sec">
        <div class="top"><span class="lbl">Sprint progress</span><span class="val">${pct(d.done, d.total)}</span></div>
        <progress value="${d.done}" max="${d.total || 1}"></progress>
        <div class="under"><span>${d.done} of ${d.total} done</span>
          <span class="tools"><span class="rf" id="rf" title="Refresh now">${sym("arrow.clockwise")}</span><span class="rf" id="gear" title="Settings">${sym("gearshape")}</span></span></div>
      </div>

      <div class="zone">JIRA</div>

      ${goalBand(d.sprintGoal, sprint.daysLeft)}
      <hr>

      ${overdue ? `
        <div class="overdue" data-url="${esc(overdue.url)}">
          ${sym("exclamationmark.triangle.fill", "c-red")}
          <div class="body">
            <div class="tag">Most overdue · ${esc(overdue.key)}</div>
            <div class="sum">${esc(overdue.summary)}</div>
            <progress value="${Math.max(.15, Math.min(1, (overdue.ratio - 1) / 2))}" max="1"></progress>
            <div class="meta">${esc(overdue.status)} · ${overdue.daysInStatus} days, ${overdue.threshold > 0
              ? `${overdue.ratio}× the ${overdue.threshold}-day limit` : "limit 0"}${overdue.carriedOver
              ? " · carried over, sprint " + overdue.sprintCount : ""}</div>
          </div>
        </div>` : `<div class="all-clear">${sym("checkmark.seal.fill", "c-green")}<span>Nothing overdue</span><span class="c-2">— every task is within its limit</span></div>`}
      <hr>

      <div class="h">My tasks <span class="n">${tasks.length}</span></div>
      ${groups.map((g) => `
        <div class="ghd p${esc(g.phase)}">${esc(g.status)} <span class="n">${g.tasks.length}</span></div>
        ${g.tasks.map(taskRow).join("")}`).join("")}

      ${relBand(d.pendingRelease || [])}

      <div class="zone">GITHUB</div>

      ${band("waiting", sym("hourglass", "sm") + "Waiting", waiting, sym("hourglass", "c-orange"))}
      ${band("review", sym("eye", "sm") + "Awaiting your review", reviews, "")}
      ${prBand(d.pullRequests || [])}
      ${d.prsAvailable !== false && d.reviewsAvailable !== false && !d.requiredError
        && !waiting.length && !reviews.length && !(d.pullRequests || []).length
        ? `<div class="clear">${sym("checkmark.seal.fill", "c-green")}<span>No PR waiting, to review or blocked</span></div>` : ""}

      ${d.prsAvailable === false ? `<div class="off">${sym("info.circle")}<div>${d.githubOrgError
        ? `PR/CI bands are off — ${esc(d.githubOrgError)}. Fix it in Settings.`
        : `PR/CI bands are off — GitHub could not be reached.
        Run <b>gh auth login</b>, or add a GitHub token in Settings.`}</div></div>` : ""}

      ${d.update ? `<div class="upd" data-url="${esc(d.update.url || "")}">
        ${sym("arrow.down.circle", "c-blue")}<span>Version <b>${esc(d.update.version)}</b> is available — click to download</span></div>` : ""}

      ${notesHtml()}
    `;

    // A PR inside a task row opens the PR, not the task as well.
    card.querySelectorAll("[data-url]").forEach((el) =>
      el.addEventListener("click", (e) => { e.stopPropagation(); openUrl(el.getAttribute("data-url")); }));
    card.querySelectorAll("[data-del]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        window.webkit?.messageHandlers?.sb?.postMessage({ noteDel: el.getAttribute("data-del") });
      }));
    const inp = card.querySelector(".ninput");
    if (inp) {
      inp.value = keepInput;            // text typed during a refresh must not be lost
      inp.addEventListener("input", () => { keepInput = inp.value; });
      inp.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key !== "Enter") return;
        const v = inp.value;
        inp.value = ""; keepInput = "";
        window.webkit?.messageHandlers?.sb?.postMessage({ noteAdd: v });
      });
      if (hadFocus) inp.focus();
    }
    card.querySelectorAll("[data-win]").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      window.webkit?.messageHandlers?.sb?.postMessage({ win: el.dataset.win });
    }));
    const rf = document.getElementById("rf");
    if (rf) rf.addEventListener("click", (e) => {
      e.stopPropagation();
      if (rf.classList.contains("spin")) return;   // block a double trigger for the ~13 s
      rf.classList.add("spin");
      refresh();
    });
    const gear = document.getElementById("gear");
    if (gear) gear.addEventListener("click", (e) => {
      e.stopPropagation();
      window.webkit?.messageHandlers?.sb?.postMessage({ settings: true });
    });
    // A window resized by hand, or moved off a smaller screen, has the same card: fit it anyway.
    fit();
  }

  // fetch.mjs normally takes ~13 s; on the FIRST launch after a rebuild it can
  // stretch to 80 s because macOS re-asks for keychain permission. Without a
  // counter that looked like the app had hung.
  const T0 = Date.now();
  let waitTimer = setInterval(() => {
    const el = document.getElementById("card");
    if (!el || LAST) return;
    const sec = Math.round((Date.now() - T0) / 1000);
    el.innerHTML = `<div class="err">${sym("hourglass", "c-2")} Fetching data… ${sec}s` +
      (sec > 25
        ? `<div class="hint">macOS may ask for keychain permission on first launch.
             If a permission dialog appeared, choose <b>Always Allow</b>;
             it is one-off — later launches take ~13s.</div>`
        : "") + `</div>`;
  }, 1000);

  window.sbRender = (d) => {
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    draw(d);
  };
</script>
